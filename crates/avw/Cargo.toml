[package]
name = "avw"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native = ["native-voxcpm", "native-qwen"]
native-voxcpm = ["dep:voxcpm-rs", "dep:burn"]
native-qwen = ["dep:qwen3_asr", "dep:candle-core"]
wgpu = ["native-voxcpm", "voxcpm-rs/wgpu", "burn/wgpu"]
metal = ["native-qwen", "qwen3_asr/metal", "candle-core/metal"]

[dependencies]
avw-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
subtle = "2.6"
burn = { version = "0.20.1", default-features = false, features = ["std", "ndarray", "simd"], optional = true }
voxcpm-rs = { git = "https://github.com/mii-nipah/voxcpm-rs", rev = "006ae18fba7d6712e6212c8dcb4d05d723917f6e", default-features = false, features = ["cpu"], optional = true }
qwen3_asr = { git = "https://github.com/lumosimmo/qwen3-asr-rs", rev = "7984967e8701cc90bb17d06453901036e36ca578", default-features = false, features = ["forced-aligner"], optional = true }
candle-core = { version = "0.9.2", optional = true }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
