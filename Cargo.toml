[workspace]
members = ["crates/avw-core", "crates/avw", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
avw-core = { path = "crates/avw-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.18", features = ["v4", "serde"] }
hound = "3.5"
tempfile = "3.20"
fs2 = "0.4"
schemars = "0.8.22"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "io-std", "fs", "time", "sync"] }
axum = "0.8.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = false
codegen-units = 16
strip = "debuginfo"
